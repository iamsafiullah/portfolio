<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article | Safi Ullah</title>
<meta name="description" content="Article by Safi Ullah, SEO & Digital Marketing Specialist.">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;color:#252b38;line-height:1.8;background:#f7f8fc}
header,main,footer{max-width:850px;margin:auto;padding:24px}
a{color:#536fae}
main{background:#fff;border-radius:12px;margin-top:20px;margin-bottom:30px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.3}
h2{color:#ff4c60}
.date{color:#667085;font-size:14px}
.hero{width:100%;height:auto;border-radius:10px}
</style>
</head>
<body>
<header><a href="blog.html">&larr; Back to Blog</a></header>
<main id="post"><p>Loading...</p></main>
<footer><a href="index.html">Return to homepage</a></footer>
<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function render(body){
  var out='',inList=false;
  String(body).split('\n').forEach(function(line){
    var t=line.trim();
    if(t.indexOf('- ')===0){
      if(!inList){out+='<ul>';inList=true;}
      out+='<li>'+inline(t.slice(2))+'</li>';return;
    }
    if(inList){out+='</ul>';inList=false;}
    if(!t) return;
    if(t.indexOf('### ')===0) out+='<h3>'+inline(t.slice(4))+'</h3>';
    else if(t.indexOf('## ')===0) out+='<h2>'+inline(t.slice(3))+'</h2>';
    else out+='<p>'+inline(t)+'</p>';
  });
  if(inList) out+='</ul>';
  return out;
}
var box=document.getElementById('post');
var id=new URLSearchParams(location.search).get('id');
if(!id){box.innerHTML='<p>Article not found.</p>';}
else{
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    firebase.firestore().collection('posts').doc(id).get().then(function(doc){
      if(!doc.exists){box.innerHTML='<p>Article not found.</p>';return;}
      var d=doc.data();
      document.title=(d.metaTitle||d.title)+' | Safi Ullah';
      var md=document.querySelector('meta[name=description]');
      if(md) md.setAttribute('content',d.metaDesc||'');
      var h='<article><h1>'+esc(d.title)+'</h1><p class="date">By Safi Ullah | '+new Date(d.createdAt).toLocaleDateString()+'</p>';
      if(d.imageUrl) h+='<img class="hero" src="'+esc(d.imageUrl)+'" alt="'+esc(d.title)+'">';
      h+=render(d.body)+'</article>';
      box.innerHTML=h;
    }).catch(function(){box.innerHTML='<p>Could not load article.</p>';});
  }catch(e){box.innerHTML='<p>Could not load article.</p>';}
}
</script>
</body>
</html>
