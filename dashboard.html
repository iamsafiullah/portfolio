<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard - Safi Ullah Blog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{--accent:#ff4c60;--bg:#111;--card:#252525;--line:#333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:15px;color:#fff;background:var(--bg);min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
h1,h2,h3{margin:0 0 15px}
.card{background:var(--card);border-radius:8px;padding:24px;margin-bottom:20px;border:1px solid var(--line)}
input,textarea{width:100%;border:1px solid #111;background:#1a1a1a;color:#fff;padding:12px 16px;margin-bottom:16px;border-radius:8px;outline:none;font:400 14px Arial,sans-serif}
textarea{height:260px;resize:vertical}
button{cursor:pointer;border:0;border-radius:30px;padding:12px 30px;font:600 14px Arial,sans-serif;text-transform:uppercase;color:#fff;background:var(--accent)}
button:hover{opacity:.85}
button.danger{background:#dc3545}
button.secondary{background:#555}
.msg{margin-left:12px;opacity:.8;font-size:13px}
.article{background:var(--card);border-radius:8px;padding:20px;margin-bottom:16px;border:1px solid var(--line)}
.article h4{color:var(--accent);margin-bottom:6px}
.article .date{font-size:12px;opacity:.6;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.login-box{max-width:400px;margin:80px auto}
.hidden{display:none}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="container">
  <div id="loginBox" class="login-box card">
    <h2>Dashboard Login</h2>
    <input type="email" id="email" placeholder="EMAIL">
    <input type="password" id="pwd" placeholder="PASSWORD">
    <button onclick="doLogin()">Login</button>
    <p id="loginMsg" class="msg"></p>
  </div>

  <div id="dashboard" class="hidden">
    <div class="row" style="justify-content:space-between;margin-bottom:20px">
      <h1>Blog Dashboard</h1>
      <div>
        <a href="blog.html" style="margin-right:15px">View Blog</a>
        <button class="secondary" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <div class="card">
      <h3>Write a new article</h3>
      <input type="text" id="title" placeholder="ARTICLE TITLE">
      <input type="text" id="metaTitle" placeholder="META TITLE (SEO, 50-60 chars)">
      <textarea id="metaDesc" placeholder="META DESCRIPTION (SEO, 150-160 chars)" style="height:80px"></textarea>
      <input type="text" id="imageUrl" placeholder="FEATURED IMAGE URL (optional)">
      <input type="text" id="tags" placeholder="TAGS (comma separated)">
      <textarea id="body" placeholder="WRITE YOUR ARTICLE HERE..."></textarea>
      <div style="background:#1a1a1a;border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:12px;color:#aaa;line-height:1.6">
        <b style="color:var(--accent)">Formatting:</b><br>
        <code>## Heading</code> big heading<br>
        <code>### Subheading</code> smaller heading<br>
        <code>- Point</code> bullet list<br>
        <code>**bold**</code> bold text<br>
        Leave a blank line between paragraphs.
      </div>
      <div class="row">
        <button onclick="publish()">Publish Article</button>
        <span id="pubMsg" class="msg"></span>
      </div>
    </div>

    <h3>Published articles</h3>
    <div id="articleList"></div>
  </div>
</div>

<script>
firebase.initializeApp(window.FIREBASE_CONFIG);
var auth=firebase.auth();
var db=firebase.firestore();

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

auth.onAuthStateChanged(function(user){
  if(user){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    loadArticles();
  } else {
    document.getElementById('loginBox').classList.remove('hidden');
    document.getElementById('dashboard').classList.add('hidden');
  }
});

function doLogin(){
  var m=document.getElementById('loginMsg');
  m.textContent='';
  auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('pwd').value)
    .catch(function(){ m.textContent='Wrong email or password.'; });
}
function doLogout(){ auth.signOut(); }

function publish(){
  var title=document.getElementById('title').value.trim();
  var body=document.getElementById('body').value.trim();
  var msg=document.getElementById('pubMsg');
  if(!title||!body){ msg.textContent='Please enter title and content.'; return; }
  var article={
    title:title,
    metaTitle:document.getElementById('metaTitle').value.trim()||title,
    metaDesc:document.getElementById('metaDesc').value.trim()||body.slice(0,160),
    imageUrl:document.getElementById('imageUrl').value.trim(),
    tags:document.getElementById('tags').value.trim(),
    body:body,
    createdAt:Date.now()
  };
  msg.textContent='Publishing...';
  db.collection('posts').add(article).then(function(){
    msg.textContent='Published! Visible on the blog.';
    ['title','metaTitle','metaDesc','imageUrl','tags','body'].forEach(function(id){document.getElementById(id).value='';});
    loadArticles();
    setTimeout(function(){ msg.textContent=''; },4000);
  }).catch(function(err){ msg.textContent='Error: '+err.message; });
}

function deleteArticle(id){
  if(!confirm('Delete this article?')) return;
  db.collection('posts').doc(id).delete().then(loadArticles).catch(function(err){ alert('Error: '+err.message); });
}

function loadArticles(){
  var list=document.getElementById('articleList');
  list.innerHTML='<p style="opacity:.6">Loading...</p>';
  db.collection('posts').orderBy('createdAt','desc').get().then(function(snap){
    if(snap.empty){ list.innerHTML='<p style="opacity:.6">No articles yet.</p>'; return; }
    var h='';
    snap.forEach(function(doc){
      var d=doc.data();
      h+='<div class="article"><h4>'+esc(d.title)+'</h4><p class="date">'+new Date(d.createdAt).toLocaleDateString()+'</p>';
      h+='<p style="font-size:14px;color:#eee">'+esc(d.body).slice(0,200)+'...</p>';
      h+='<div class="row" style="margin-top:12px"><a href="article.html?id='+doc.id+'" target="_blank">View</a>';
      h+='<button class="danger" onclick="deleteArticle(\''+doc.id+'\')">Delete</button></div></div>';
    });
    list.innerHTML=h;
  }).catch(function(err){ list.innerHTML='<p>Error: '+esc(err.message)+'</p>'; });
}
</script>
</body>
</html>
